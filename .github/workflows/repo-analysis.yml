name: Repository Code Quality Analysis

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-repos:
    name: Analyze GitHub profile repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze public repositories
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          #!/bin/bash
          set -e
          
          USERNAME="midu16"
          
          echo "🔍 Fetching all public repositories for $USERNAME..."
          
          # Fetch all public repos using GitHub API (paginate — the endpoint returns max 100 per page)
          repos_json=""
          for page in 1 2 3 4 5; do
            batch=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/users/$USERNAME/repos?per_page=100&type=public&page=$page")
            batch_len=$(echo "$batch" | jq 'length')
            if [ "$repos_json" = "" ]; then
              repos_json="$batch"
            else
              repos_json=$(echo "$repos_json" "$batch" | jq -sc '.[0] + .[1]')
            fi
            if [ "$batch_len" -lt 100 ]; then
              break
            fi
          done
          
          # Initialize counters
          total_repos=0
          total_stars=0
          total_forks=0
          total_issues=0
          total_size=0
          declare -A lang_count
          declare -A lang_bytes
          active_repos=0
          archived_repos=0
          
          # Get current date for activity check (repos updated in last 6 months)
          six_months_ago=$(date -d '6 months ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -v-6m +%Y-%m-%dT%H:%M:%SZ)
          
          echo ""
          echo "📊 Analyzing repositories..."
          echo ""
          
          # Parse each repository
          for repo in $(echo "$repos_json" | jq -r '.[] | @base64'); do
            _jq() {
              echo "$repo" | base64 --decode | jq -r "${1}"
            }
            
            name=$(_jq '.name')
            stars=$(_jq '.stargazers_count')
            forks=$(_jq '.forks_count')
            issues=$(_jq '.open_issues_count')
            size=$(_jq '.size')
            language=$(_jq '.language')
            archived=$(_jq '.archived')
            updated_at=$(_jq '.updated_at')
            
            # Skip if null or this profile repo
            if [ "$name" == "null" ]; then
              continue
            fi
            
            total_repos=$((total_repos+1))
            total_stars=$((total_stars + stars))
            total_forks=$((total_forks + forks))
            total_issues=$((total_issues + issues))
            total_size=$((total_size + size))
            
            # Count archived vs active
            if [ "$archived" == "true" ]; then
              archived_repos=$((archived_repos+1))
            else
              # Check if recently updated
              if [[ "$updated_at" > "$six_months_ago" ]]; then
                active_repos=$((active_repos+1))
              fi
            fi
            
            # Count languages
            if [ "$language" != "null" ] && [ -n "$language" ]; then
              if [ -z "${lang_count[$language]}" ]; then
                lang_count[$language]=0
              fi
              lang_count[$language]=$((${lang_count[$language]} + 1))
            fi
            
            echo "  ✓ $name (⭐ $stars, 🍴 $forks, $language)"
          done
          
          # Calculate averages
          if [ $total_repos -gt 0 ]; then
            avg_stars=$(echo "scale=1; $total_stars / $total_repos" | bc)
            avg_size=$(echo "scale=1; $total_size / $total_repos" | bc)
          else
            avg_stars=0
            avg_size=0
          fi
          
          # Convert size to MB
          total_size_mb=$(echo "scale=2; $total_size / 1024" | bc)
          
          # Sort languages by count and get top 5
          top_languages=""
          for lang in "${!lang_count[@]}"; do
            echo "${lang_count[$lang]} $lang"
          done | sort -rn | head -5 | while read count lang; do
            top_languages="$top_languages$lang ($count), "
          done
          
          # Generate language breakdown for output
          lang_breakdown=""
          for lang in "${!lang_count[@]}"; do
            if [ -n "$lang_breakdown" ]; then
              lang_breakdown="$lang_breakdown, "
            fi
            lang_breakdown="$lang_breakdown$lang: ${lang_count[$lang]}"
          done
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 ANALYSIS SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Total Repositories: $total_repos"
          echo "Active Repos (updated in 6 months): $active_repos"
          echo "Archived Repos: $archived_repos"
          echo "Total Stars: $total_stars"
          echo "Total Forks: $total_forks"
          echo "Open Issues: $total_issues"
          echo "Total Size: ${total_size_mb} MB"
          echo "Languages: $lang_breakdown"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Calculate code quality score (0-100)
          # Based on: activity, stars, diversity, maintenance
          activity_score=$((active_repos * 100 / (total_repos > 0 ? total_repos : 1)))
          star_score=$((total_stars > 50 ? 100 : total_stars * 2))
          lang_diversity=$((${#lang_count[@]} > 5 ? 100 : ${#lang_count[@]} * 20))
          maintenance_score=$((total_issues < 10 ? 100 : (100 - total_issues)))
          maintenance_score=$((maintenance_score < 0 ? 0 : maintenance_score))
          
          quality_score=$(( (activity_score + star_score + lang_diversity + maintenance_score) / 4 ))
          
          # Determine grade
          if [ $quality_score -ge 90 ]; then
            grade="A+"
            grade_color="brightgreen"
          elif [ $quality_score -ge 80 ]; then
            grade="A"
            grade_color="green"
          elif [ $quality_score -ge 70 ]; then
            grade="B"
            grade_color="yellowgreen"
          elif [ $quality_score -ge 60 ]; then
            grade="C"
            grade_color="yellow"
          else
            grade="D"
            grade_color="orange"
          fi
          
          echo ""
          echo "🎯 Code Quality Score: $quality_score/100 (Grade: $grade)"
          
          # Save outputs for next step
          echo "total_repos=$total_repos" >> $GITHUB_OUTPUT
          echo "active_repos=$active_repos" >> $GITHUB_OUTPUT
          echo "total_stars=$total_stars" >> $GITHUB_OUTPUT
          echo "total_forks=$total_forks" >> $GITHUB_OUTPUT
          echo "total_issues=$total_issues" >> $GITHUB_OUTPUT
          echo "total_size_mb=$total_size_mb" >> $GITHUB_OUTPUT
          echo "quality_score=$quality_score" >> $GITHUB_OUTPUT
          echo "grade=$grade" >> $GITHUB_OUTPUT
          echo "grade_color=$grade_color" >> $GITHUB_OUTPUT
          echo "lang_count=${#lang_count[@]}" >> $GITHUB_OUTPUT
          
          # Save detailed data to file for README update
          cat > /tmp/repo-metrics.json << EOF
          {
            "total_repos": $total_repos,
            "active_repos": $active_repos,
            "archived_repos": $archived_repos,
            "total_stars": $total_stars,
            "total_forks": $total_forks,
            "total_issues": $total_issues,
            "total_size_mb": "$total_size_mb",
            "quality_score": $quality_score,
            "grade": "$grade",
            "grade_color": "$grade_color",
            "languages_count": ${#lang_count[@]},
            "last_updated": "$(date -u +%Y-%m-%d)"
          }
          EOF
          
          cat /tmp/repo-metrics.json

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("/tmp/profile-report.json").read_text())
          outputs = Path(os.environ["GITHUB_OUTPUT"])

          def write(name, value):
              with outputs.open("a", encoding="utf-8") as handle:
                  handle.write(f"{name}={value}\n")

          score = report["estimated_gitscore_repo_quality"]
          if score >= 180:
              grade, grade_color = "A", "brightgreen"
          elif score >= 150:
              grade, grade_color = "B", "yellowgreen"
          elif score >= 120:
              grade, grade_color = "C", "yellow"
          elif score >= 90:
              grade, grade_color = "D", "orange"
          else:
              grade, grade_color = "F", "red"

          write("total_repos", report["total_repos"])
          write("original_repos", report["original_repos"])
          write("fork_repos", report["fork_repos"])
          write("active_repos", report["active_original_repos_6mo"])
          write("total_stars", report["total_stars"])
          write("total_forks", report["total_forks_received"])
          write("quality_score", score)
          write("quality_max", report["estimated_gitscore_max"])
          write("grade", grade)
          write("grade_color", grade_color)
          write("missing_license", report["originals_without_license"])
          write("missing_topics", report["originals_without_topics"])
          write("missing_description", report["originals_without_description"])
          write("analyzed_at", report["analyzed_at"])
          PY

      - name: Update README metrics
        env:
          TOTAL_REPOS: ${{ steps.analyze.outputs.total_repos }}
          ORIGINAL_REPOS: ${{ steps.analyze.outputs.original_repos }}
          FORK_REPOS: ${{ steps.analyze.outputs.fork_repos }}
          ACTIVE_REPOS: ${{ steps.analyze.outputs.active_repos }}
          TOTAL_STARS: ${{ steps.analyze.outputs.total_stars }}
          TOTAL_FORKS: ${{ steps.analyze.outputs.total_forks }}
          LANG_COUNT: ${{ steps.analyze.outputs.lang_count }}
          TOTAL_SIZE_MB: ${{ steps.analyze.outputs.total_size_mb }}
        run: |
          #!/bin/bash
          set -e

          echo "📝 Regenerating the metrics section of README.md..."

          # Build the replacement section (quoted heredoc; placeholders substituted below)
          NEW_SECTION=$(cat << 'METRICS_EOF'
          ## 📈 Activity & Repository Metrics

          <div align="center">
            <table width="100%">
              <tr>
                <th align="center">Metric</th>
                <th align="center">Value</th>
              </tr>
              <tr>
                <td align="left"><strong>Total Repositories</strong></td>
                <td align="center"><img src="https://img.shields.io/badge/Repos-TOTAL_REPOS-blue?style=flat-square" alt="Total public repositories" /></td>
              </tr>
              <tr>
                <td align="left"><strong>Active Repositories</strong></td>
                <td align="center"><img src="https://img.shields.io/badge/Active-ACTIVE_REPOS-green?style=flat-square" alt="Repositories updated in the last 6 months" /></td>
              </tr>
              <tr>
                <td align="left"><strong>Total Stars</strong></td>
                <td align="center"><img src="https://img.shields.io/badge/Stars-TOTAL_STARS-yellow?style=flat-square" alt="Total stars across public repositories" /></td>
              </tr>
              <tr>
                <td align="left"><strong>Total Forks</strong></td>
                <td align="center"><img src="https://img.shields.io/badge/Forks-TOTAL_FORKS-orange?style=flat-square" alt="Total forks across public repositories" /></td>
              </tr>
              <tr>
                <td align="left"><strong>Language Diversity</strong></td>
                <td align="center"><img src="https://img.shields.io/badge/Languages-LANG_COUNT-purple?style=flat-square" alt="Distinct primary languages" /></td>
              </tr>
              <tr>
                <td align="left"><strong>Repository Mass</strong></td>
                <td align="center"><img src="https://img.shields.io/badge/Size-TOTAL_SIZE_MB%20MB-lightgrey?style=flat-square" alt="Combined repository size in megabytes" /></td>
              </tr>
            </table>
          </div>

          <div align="center">
            <br/>

            <img src="https://activity-graph.vercel.app/graph?username=midu16&theme=github-dark&hide_border=true" alt="Contribution activity graph for the last year" />

            <br/>

            <sub>🔄 Last analyzed: LAST_UPDATED · 🤖 Auto-generated by <a href="https://github.com/midu16/midu16/actions/workflows/repo-analysis.yml">GitHub Actions</a></sub>
          </div>

          METRICS_EOF
          )

          LAST_UPDATED=$(date -u +%Y-%m-%d)
          NEW_SECTION="${NEW_SECTION//LAST_UPDATED/$LAST_UPDATED}"
          NEW_SECTION="${NEW_SECTION//TOTAL_REPOS/$TOTAL_REPOS}"
          NEW_SECTION="${NEW_SECTION//ORIGINAL_REPOS/$ORIGINAL_REPOS}"
          NEW_SECTION="${NEW_SECTION//FORK_REPOS/$FORK_REPOS}"
          NEW_SECTION="${NEW_SECTION//ACTIVE_REPOS/$ACTIVE_REPOS}"
          NEW_SECTION="${NEW_SECTION//TOTAL_STARS/$TOTAL_STARS}"
          NEW_SECTION="${NEW_SECTION//TOTAL_FORKS/$TOTAL_FORKS}"
          NEW_SECTION="${NEW_SECTION//LANG_COUNT/$LANG_COUNT}"
          NEW_SECTION="${NEW_SECTION//TOTAL_SIZE_MB/$TOTAL_SIZE_MB}"

          printf '%s\n' "$NEW_SECTION" > /tmp/new-section.md

          # Use Python to update the README (more reliable for multi-line replacement)
          python3 << 'PYTHON_EOF'
          import re

          with open('README.md') as f:
              content = f.read()

          with open('/tmp/new-section.md') as f:
              new_section = f.read()

          # Match the metrics section: from its heading up to the next markdown heading or ---
          pattern = r'## 📈 Activity & Repository Metrics.*?(?=\n## |\n---|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if not match:
              raise SystemExit('❌ Could not locate the "Activity & Repository Metrics" section in README.md')

          content = content.replace(match.group(0), new_section.strip())
          with open('README.md', 'w') as f:
              f.write(content)
          print('✅ Metrics section updated')
          PYTHON_EOF

          echo "📝 README.md updated with the latest metrics"

          echo "$NEW_SECTION" > /tmp/new-section.md

          python3 <<'PYTHON_EOF'
          import re
          from pathlib import Path

          content = Path("README.md").read_text(encoding="utf-8")
          new_section = Path("/tmp/new-section.md").read_text(encoding="utf-8")
          pattern = r"### 🔬 Code Quality Analysis.*?(?=\n### |\n---|\Z)"
          if re.search(pattern, content, re.DOTALL):
              content = re.sub(pattern, new_section.strip(), content, flags=re.DOTALL)
          Path("README.md").write_text(content, encoding="utf-8")
          PYTHON_EOF

      - name: Commit analysis artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md docs/repo-quality-report.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Update repository quality metrics [skip ci]"
            git push
          fi

      - name: Generate workflow summary
        env:
          QUALITY_SCORE: ${{ steps.analyze.outputs.quality_score }}
          QUALITY_MAX: ${{ steps.analyze.outputs.quality_max }}
          GRADE: ${{ steps.analyze.outputs.grade }}
          TOTAL_REPOS: ${{ steps.analyze.outputs.total_repos }}
          MISSING_LICENSE: ${{ steps.analyze.outputs.missing_license }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Repository analysis complete

          | Metric | Value |
          |--------|-------|
          | Total Repositories | $TOTAL_REPOS |
          | Active Repositories | $ACTIVE_REPOS |
          | Total Stars | ⭐ $TOTAL_STARS |
          | Quality Score | $QUALITY_SCORE/100 |
          | Grade | **$GRADE** |
          
          ✅ README.md has been updated with the latest metrics!
          EOF
name: Repository Code Quality Analysis

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-repos:
    name: Analyze GitHub profile repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze public repositories
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/analyze_github_profile.py midu16 \
            --json-out /tmp/profile-report.json \
            --markdown-out docs/repo-quality-report.md

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("/tmp/profile-report.json").read_text())
          outputs = Path(os.environ["GITHUB_OUTPUT"])

          def write(name, value):
              with outputs.open("a", encoding="utf-8") as handle:
                  handle.write(f"{name}={value}\n")

          score = report["estimated_gitscore_repo_quality"]
          if score >= 180:
              grade, grade_color = "A", "brightgreen"
          elif score >= 150:
              grade, grade_color = "B", "yellowgreen"
          elif score >= 120:
              grade, grade_color = "C", "yellow"
          elif score >= 90:
              grade, grade_color = "D", "orange"
          else:
              grade, grade_color = "F", "red"

          write("total_repos", report["total_repos"])
          write("original_repos", report["original_repos"])
          write("fork_repos", report["fork_repos"])
          write("active_repos", report["active_original_repos_6mo"])
          write("total_stars", report["total_stars"])
          write("total_forks", report["total_forks_received"])
          write("quality_score", score)
          write("quality_max", report["estimated_gitscore_max"])
          write("grade", grade)
          write("grade_color", grade_color)
          write("missing_license", report["originals_without_license"])
          write("missing_topics", report["originals_without_topics"])
          write("missing_description", report["originals_without_description"])
          write("analyzed_at", report["analyzed_at"])
          PY

      - name: Update README metrics
        env:
          TOTAL_REPOS: ${{ steps.analyze.outputs.total_repos }}
          ORIGINAL_REPOS: ${{ steps.analyze.outputs.original_repos }}
          FORK_REPOS: ${{ steps.analyze.outputs.fork_repos }}
          ACTIVE_REPOS: ${{ steps.analyze.outputs.active_repos }}
          TOTAL_STARS: ${{ steps.analyze.outputs.total_stars }}
          TOTAL_FORKS: ${{ steps.analyze.outputs.total_forks }}
          QUALITY_SCORE: ${{ steps.analyze.outputs.quality_score }}
          QUALITY_MAX: ${{ steps.analyze.outputs.quality_max }}
          GRADE: ${{ steps.analyze.outputs.grade }}
          GRADE_COLOR: ${{ steps.analyze.outputs.grade_color }}
          MISSING_LICENSE: ${{ steps.analyze.outputs.missing_license }}
          MISSING_TOPICS: ${{ steps.analyze.outputs.missing_topics }}
          MISSING_DESCRIPTION: ${{ steps.analyze.outputs.missing_description }}
          ANALYZED_AT: ${{ steps.analyze.outputs.analyzed_at }}
        run: |
          set -euo pipefail
          LAST_UPDATED="${ANALYZED_AT}"

          NEW_SECTION=$(cat <<METRICS_EOF
          ### 🔬 Code Quality Analysis

          <div align="center">
            <table>
              <tr>
                <td align="center" colspan="2">
                  <strong>GitScore Repository Quality (estimated)</strong><br/>
                  <sub>All public repositories · see <a href="docs/repo-quality-playbook.md">playbook</a></sub>
                </td>
              </tr>
              <tr>
                <td align="center" width="50%">
                  <img src="https://img.shields.io/badge/Repository_Quality-QUALITY_SCORE%2FQUALITY_MAX-GRADE_COLOR?style=for-the-badge&labelColor=0D1117" alt="Repository quality score" /><br/>
                  <img src="https://img.shields.io/badge/Grade-GRADE-GRADE_COLOR?style=for-the-badge&labelColor=0D1117" alt="Grade" />
                </td>
                <td align="center" width="50%">
                  <img src="https://github-readme-stats.vercel.app/api?username=midu16&show_icons=true&include_all_commits=true&count_private=true&hide=issues&custom_title=Code%20Metrics&theme=transparent&bg_color=0D111700&title_color=00D4FF&icon_color=7B61FF&text_color=C9D1D9&border_color=30363D&border_radius=10&hide_border=true" alt="Code metrics" />
                </td>
              </tr>
            </table>
          </div>

          <div align="center">
            <table>
              <tr>
                <th>Metric</th>
                <th>Value</th>
                <th>Insight</th>
              </tr>
              <tr>
                <td><strong>Public repositories</strong></td>
                <td><img src="https://img.shields.io/badge/Total-TOTAL_REPOS-00D4FF?style=flat-square&labelColor=0D1117" alt="TOTAL_REPOS repositories" /></td>
                <td>ORIGINAL_REPOS original · FORK_REPOS forks</td>
              </tr>
              <tr>
                <td><strong>Active originals</strong></td>
                <td><img src="https://img.shields.io/badge/Active-ACTIVE_REPOS-7B61FF?style=flat-square&labelColor=0D1117" alt="ACTIVE_REPOS active repositories" /></td>
                <td>Updated in the last 6 months</td>
              </tr>
              <tr>
                <td><strong>Stars received</strong></td>
                <td><img src="https://img.shields.io/badge/Stars-TOTAL_STARS-C9D1D9?style=flat-square&labelColor=0D1117" alt="TOTAL_STARS stars" /></td>
                <td>Community recognition</td>
              </tr>
              <tr>
                <td><strong>Forks received</strong></td>
                <td><img src="https://img.shields.io/badge/Forks-TOTAL_FORKS-30363D?style=flat-square&labelColor=0D1117" alt="TOTAL_FORKS forks" /></td>
                <td>Downstream reuse on original repos</td>
              </tr>
              <tr>
                <td><strong>Metadata gaps</strong></td>
                <td><img src="https://img.shields.io/badge/License-MISSING_LICENSE-30363D?style=flat-square&labelColor=0D1117" alt="Missing license" /></td>
                <td>MISSING_TOPICS without topics · MISSING_DESCRIPTION without description</td>
              </tr>
            </table>

            <br/>
            <sub>Last analyzed: LAST_UPDATED · Auto-generated by <a href="https://github.com/midu16/midu16/actions/workflows/repo-analysis.yml">GitHub Actions</a> · <a href="docs/repo-quality-report.md">full report</a></sub>
          </div>

          <div align="center">
            <table>
              <tr>
                <td align="center" width="50%">
                  <strong>Language Distribution</strong><br/>
                  <img src="https://github-readme-stats.vercel.app/api/top-langs/?username=midu16&langs_count=10&layout=compact&theme=transparent&bg_color=0D111700&title_color=00D4FF&icon_color=7B61FF&text_color=C9D1D9&border_color=30363D&border_radius=10&hide_border=true" alt="Language distribution" />
                </td>
                <td align="center" width="50%">
                  <strong>Contribution Activity</strong><br/>
                  <img src="https://github-readme-stats.vercel.app/api?username=midu16&show_icons=true&hide=contribs,prs&custom_title=Activity&theme=transparent&bg_color=0D111700&title_color=00D4FF&icon_color=7B61FF&text_color=C9D1D9&border_color=30363D&border_radius=10&hide_border=true" alt="Contribution activity" />
                </td>
              </tr>
            </table>
          </div>

          METRICS_EOF
          )

          NEW_SECTION="${NEW_SECTION//QUALITY_SCORE/$QUALITY_SCORE}"
          NEW_SECTION="${NEW_SECTION//QUALITY_MAX/$QUALITY_MAX}"
          NEW_SECTION="${NEW_SECTION//GRADE_COLOR/$GRADE_COLOR}"
          NEW_SECTION="${NEW_SECTION//GRADE/$GRADE}"
          NEW_SECTION="${NEW_SECTION//TOTAL_REPOS/$TOTAL_REPOS}"
          NEW_SECTION="${NEW_SECTION//ORIGINAL_REPOS/$ORIGINAL_REPOS}"
          NEW_SECTION="${NEW_SECTION//FORK_REPOS/$FORK_REPOS}"
          NEW_SECTION="${NEW_SECTION//ACTIVE_REPOS/$ACTIVE_REPOS}"
          NEW_SECTION="${NEW_SECTION//TOTAL_STARS/$TOTAL_STARS}"
          NEW_SECTION="${NEW_SECTION//TOTAL_FORKS/$TOTAL_FORKS}"
          NEW_SECTION="${NEW_SECTION//MISSING_LICENSE/$MISSING_LICENSE}"
          NEW_SECTION="${NEW_SECTION//MISSING_TOPICS/$MISSING_TOPICS}"
          NEW_SECTION="${NEW_SECTION//MISSING_DESCRIPTION/$MISSING_DESCRIPTION}"
          NEW_SECTION="${NEW_SECTION//LAST_UPDATED/$LAST_UPDATED}"

          echo "$NEW_SECTION" > /tmp/new-section.md

          python3 <<'PYTHON_EOF'
          import re
          from pathlib import Path

          content = Path("README.md").read_text(encoding="utf-8")
          new_section = Path("/tmp/new-section.md").read_text(encoding="utf-8")
          pattern = r"### 🔬 Code Quality Analysis.*?(?=\n### |\n---|\Z)"
          if re.search(pattern, content, re.DOTALL):
              content = re.sub(pattern, new_section.strip(), content, flags=re.DOTALL)
          Path("README.md").write_text(content, encoding="utf-8")
          PYTHON_EOF

      - name: Commit analysis artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md docs/repo-quality-report.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Update repository quality metrics [skip ci]"
            git push
          fi

      - name: Generate workflow summary
        env:
          QUALITY_SCORE: ${{ steps.analyze.outputs.quality_score }}
          QUALITY_MAX: ${{ steps.analyze.outputs.quality_max }}
          GRADE: ${{ steps.analyze.outputs.grade }}
          TOTAL_REPOS: ${{ steps.analyze.outputs.total_repos }}
          MISSING_LICENSE: ${{ steps.analyze.outputs.missing_license }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Repository analysis complete

          | Metric | Value |
          |--------|-------|
          | Public repositories | ${TOTAL_REPOS} |
          | Estimated GitScore repository quality | ${QUALITY_SCORE}/${QUALITY_MAX} |
          | Grade | **${GRADE}** |
          | Original repos missing license | ${MISSING_LICENSE} |

          See [docs/repo-quality-playbook.md](docs/repo-quality-playbook.md) for improvement steps.
          EOF
